apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Postgres
    uid: postgres
    type: postgres
    url: shortener-db:5432
    user: shortener
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: shortener
      sslmode: disable
