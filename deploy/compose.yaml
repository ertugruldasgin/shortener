services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      - app

  app:
    build:
      context: ..
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://shortener:${POSTGRES_PASSWORD}@postgres:5432/shortener?sslmode=disable
      ADDR: ":8080"
      BASE_URL: ${BASE_URL:-https://logn.cc}
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shortener
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  frontend:
  backend:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
