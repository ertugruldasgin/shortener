services:
  app:
    build:
      context: ..
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://shortener:${POSTGRES_PASSWORD}@shortener-db:5432/shortener?sslmode=disable
      API_TOKEN: ${API_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADDR: ":8080"
      BASE_URL: ${BASE_URL:-https://logn.cc}
      REDIS_URL: redis://redis:6379/0
      CLICK_BUFFER_SIZE: ${CLICK_BUFFER_SIZE:-2048}
      RATE_LIMIT_CREATE: ${RATE_LIMIT_CREATE:-60}
      RATE_LIMIT_REDIRECT: ${RATE_LIMIT_REDIRECT:-300}
    ports:
      - "${APP_PORT:-127.0.0.1:8080}:8080"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shortener
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      backend:
        aliases:
          - shortener-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${GRAFANA_PORT:-127.0.0.1:3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - backend
    depends_on:
      - prometheus

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
