services:
  app:
    build:
      context: ..
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://shortener:${POSTGRES_PASSWORD}@shortener-db:5432/shortener?sslmode=disable
      ADDR: ":8080"
      BASE_URL: ${BASE_URL:-https://logn.cc}
    networks:
      - backend
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      traefik.http.routers.shortener.rule: "Host(`logn.cc`)"
      traefik.http.routers.shortener.entrypoints: "https"
      traefik.http.routers.shortener.tls: "true"
      traefik.http.routers.shortener.tls.certresolver: "letsencrypt"
      traefik.http.services.shortener.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shortener
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      backend:
        aliases:
          - shortener-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  backend:
  coolify:
    external: true

volumes:
  postgres_data:
