services:
  app:
    build:
      context: ..
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://shortener:${POSTGRES_PASSWORD}@shortener-db:5432/shortener?sslmode=disable
      API_TOKEN: ${API_TOKEN}
      ADDR: ":8080"
      BASE_URL: ${BASE_URL:-https://logn.cc}
    ports:
      - "${APP_PORT:-127.0.0.1:8080}:8080"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shortener
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      backend:
        aliases:
          - shortener-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  backend:

volumes:
  postgres_data:
